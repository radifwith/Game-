<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Racer Escape</title>
<link rel="stylesheet" href="style.css">

<!-- Phaser -->
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/phaser3-rex-plugins/dist/rexvirtualjoystickplugin.min.js"></script>
</head>

<body>

<!-- GAME CANVAS -->
<div id="game-container"></div>

<!-- ===== UI LAYER (PRD STYLE) ===== -->
<div id="ui-layer">

<!-- TOP HUD -->
<div id="hud-top">
<div id="score-text">SCORE: 0</div>
<button id="pause-btn"></button>
</div>

<!-- BOOST BUTTON -->
<div id="boost-container">
<button id="boost-btn"></button>
<div id="boost-cooldown-overlay"></div>
</div>

<!-- HEAT EFFECT -->
<div id="heat-effect"></div>

<!-- GAME OVER -->
<div id="game-over-screen" class="hidden">
<div class="modal">
<h1>BUSTED!</h1>
<p id="final-score">SCORE: 0</p>

<div class="menu-buttons">
<button id="rematch-btn" class="action-btn">REMATCH</button>
<button id="home-btn" class="action-btn">HOME</button>
</div>
</div>
</div>

</div>

<!-- ORIENTATION WARNING -->
<div id="orientation-warning">
Please Rotate Your Device 
</div>

<!-- GAME SCRIPT LAST -->
<script src="game.js"></script>

</body>
</html>
